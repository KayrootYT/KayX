name: Extract KayX ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Safely extract project ZIP
        run: |
          python3 - <<'PY'
          import pathlib, stat, zipfile
          archive = pathlib.Path("KayX.zip")
          target = pathlib.Path("KayX-source")
          if not archive.is_file():
              raise SystemExit("KayX.zip not found")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if p.is_absolute() or ".." in p.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Unsafe archive entry: {item.filename}")
              z.extractall(target)
              print(f"Extracted {len(z.infolist())} entries")
          PY
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add KayX-source/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract KayX project ZIP into repository"
          git push
