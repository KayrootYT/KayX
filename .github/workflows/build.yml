name: Build and test KayX
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kayx-core
      - name: Rust unit tests
        run: cargo test --manifest-path rust/kayx-core/Cargo.toml
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK artifact + native libs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libkayx_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: KayX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  notify-telegram:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Send build result to KayXManager channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@KayXManager"
          BUILD_RESULT: ${{ needs.build.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Telegram not configured. Add TELEGRAM_BOT_TOKEN as a repository Actions secret."
            exit 0
          fi
          case "$BUILD_RESULT" in
            success) ICON="✅";;
            failure) ICON="❌";;
            cancelled) ICON="⚪";;
            *) ICON="⚠️";;
          esac
          MESSAGE="$ICON KayX build: $BUILD_RESULT
          Repository: $REPOSITORY
          Branch: $BRANCH
          Commit: ${COMMIT:0:7}
          Triggered by: $ACTOR
          Logs: $RUN_URL"
          curl --fail --silent --show-error --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true"
