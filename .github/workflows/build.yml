name: Build and test KayX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require stable signing secrets for distributable APKs
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KAYX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAYX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAYX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAYX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Add KAYX_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Add KAYX_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Add KAYX_KEY_ALIAS repository secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Add KAYX_KEY_PASSWORD repository secret."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kayx-core
      - name: Rust unit tests
        run: cargo test --manifest-path rust/kayx-core/Cargo.toml
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Prepare stable signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KAYX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kayx-release.jks"
          test -s "$RUNNER_TEMP/kayx-release.jks"
      - name: Validate stable signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kayx-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KAYX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAYX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAYX_KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -certreq -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/kayx-signing-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/kayx-signing-check.csr"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build APK
        env:
          KAYX_KEYSTORE_PATH: ${{ runner.temp }}/kayx-release.jks
          KAYX_KEYSTORE_PASSWORD: ${{ secrets.KAYX_KEYSTORE_PASSWORD }}
          KAYX_KEY_ALIAS: ${{ secrets.KAYX_KEY_ALIAS }}
          KAYX_KEY_PASSWORD: ${{ secrets.KAYX_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ./gradlew assembleDebug --no-daemon
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/kayx-ci-release.jks" \
              -storepass changeit -keypass changeit -alias kayx \
              -dname "CN=KayX CI Temporary" -keyalg RSA -keysize 2048 -validity 2
            export KAYX_KEYSTORE_PATH="$RUNNER_TEMP/kayx-ci-release.jks"
            export KAYX_KEYSTORE_PASSWORD=changeit
            export KAYX_KEY_ALIAS=kayx
            export KAYX_KEY_PASSWORD=changeit
          fi
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK artifact + native libs
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            APK="app/build/outputs/apk/debug/app-debug.apk"
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/release/app-release.apk"
            RELEASE_APK="$APK"
          fi
          test -s "$APK"
          test -s "$RELEASE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          unzip -l "$APK" | grep libkayx_core.so
          unzip -l "$RELEASE_APK" | grep libkayx_core.so
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$RELEASE_APK" | grep "uses-permission" | sed -E "s/.*name='([^']+)'.*/\\1/" | sort -u > "$RUNNER_TEMP/kayx-apk-permissions.txt"
          unreviewed_permissions=0
          while IFS= read -r permission; do
            if ! grep -Fxq "$permission" docs/APK_PERMISSION_ALLOWLIST.txt; then
              echo "::error::Unreviewed permission in APK: $permission"
              unreviewed_permissions=1
            fi
          done < "$RUNNER_TEMP/kayx-apk-permissions.txt"
          if [ "$unreviewed_permissions" -ne 0 ]; then
            echo "::error::Review the complete permission list above; the audit reports all missing entries in one run."
            exit 1
          fi
          echo "Verified APK permissions:"
          cat "$RUNNER_TEMP/kayx-apk-permissions.txt"
      - name: Run Android startup smoke and semantics tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KayX-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  notify-telegram:
    name: Upload APK to Telegram
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && github.event_name != 'pull_request'
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: KayX-apk
          path: ./dist

      - name: Upload APK to KayXManager channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@KayXManager"
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          APK="$(find ./dist -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in the downloaded KayX-apk artifact."
            find ./dist -maxdepth 4 -type f -print
            exit 1
          fi
          if [ ! -s "$APK" ] || [ ! -r "$APK" ]; then
            echo "::error::APK is empty or unreadable: $APK"
            exit 1
          fi

          export APK_PATH="$APK"
          echo "Uploading $(basename "$APK") ($(stat -c%s "$APK") bytes) to $TELEGRAM_CHAT_ID"
          python3 - <<'PY'
          import http.client
          import json
          import os
          import secrets
          import sys

          apk = os.environ["APK_PATH"]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          commit = os.environ["COMMIT"][:7]
          filename = os.path.basename(apk)
          caption = f"KayX APK build\nRepository: {repository}\nBranch: {branch}\nCommit: {commit}"

          boundary = "----KayXUpload" + secrets.token_hex(16)
          def field(name, value):
              return (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="{name}"\r\n\r\n'
                  f"{value}\r\n"
              ).encode()

          prefix = (
              field("chat_id", chat_id)
              + field("caption", caption)
              + (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="document"; filename="{filename}"\r\n'
                  "Content-Type: application/vnd.android.package-archive\r\n\r\n"
              ).encode()
          )
          suffix = f"\r\n--{boundary}--\r\n".encode()
          content_length = len(prefix) + os.path.getsize(apk) + len(suffix)

          connection = http.client.HTTPSConnection("api.telegram.org", timeout=240)
          try:
              connection.putrequest("POST", f"/bot{token}/sendDocument")
              connection.putheader("Content-Type", f"multipart/form-data; boundary={boundary}")
              connection.putheader("Content-Length", str(content_length))
              connection.endheaders()
              connection.send(prefix)
              with open(apk, "rb") as source:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      connection.send(chunk)
              connection.send(suffix)
              response = connection.getresponse()
              result = json.loads(response.read().decode("utf-8"))
              if response.status != 200 or not result.get("ok"):
                  print("Telegram upload failed:", json.dumps(result), file=sys.stderr)
                  sys.exit(1)
              print(f"Telegram accepted APK upload: {filename}")
          finally:
              connection.close()
          PY
