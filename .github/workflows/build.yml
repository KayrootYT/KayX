name: Build and test KayX
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kayx-core
      - name: Rust unit tests
        run: cargo test --manifest-path rust/kayx-core/Cargo.toml
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK artifact + native libs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libkayx_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: KayX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  notify-telegram:
    name: Upload APK to Telegram
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: KayX-debug
          path: ./dist

      - name: Upload APK to KayXManager channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@KayXManager"
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          APK="$(find ./dist -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in the downloaded KayX-debug artifact."
            find ./dist -maxdepth 4 -type f -print
            exit 1
          fi
          if [ ! -r "$APK" ]; then
            echo "::error::APK is not readable: $APK"
            exit 1
          fi

          APK_NAME="$(basename "$APK")"
          echo "Uploading $APK_NAME ($(stat -c%s "$APK") bytes)"
          CAPTION="KayX APK build
          Repository: $REPOSITORY
          Branch: $BRANCH
          Commit: ${COMMIT:0:7}"

          RESPONSE="$(curl --fail --silent --show-error --max-time 120 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK}" \
            -F "caption=${CAPTION}")"
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
          echo "Telegram accepted APK upload: $APK_NAME"
