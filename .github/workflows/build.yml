name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # यह स्टेप रिपॉजिटरी में मौजूद ज़िप फ़ाइल को ढूंढकर अपने आप अनजिप कर देगा
    - name: Unzip Project Archive
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
        else
          echo "No zip file found in root, proceeding with standard structure."
        fi

    # यदि ज़िप अनजिप होने के बाद 'KayX' फोल्डर के अंदर है, तो यह कमांड वहां से बिल्ड चलाएगी
    - name: Build Debug APK
      run: |
        if [ -d "extracted_project/KayX" ]; then
          cd extracted_project/KayX
          gradle assembleDebug
        elif [ -f "build.gradle.kts" ]; then
          gradle assembleDebug
        else
          echo "Build configuration not found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KayX-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
