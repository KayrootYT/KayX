name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip Project Archive
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
        else
          echo "No zip file found in root."
        fi

    # यह स्टेप अनजिप फोल्डर के अंदर जाकर अपने आप ग्रेdle ढूंढकर बिल्ड कर देगा
    - name: Build Debug APK
      run: |
        if [ -d "extracted_project/KayX" ]; then
          cd extracted_project/KayX
          gradle assembleDebug
        elif [ -d "extracted_project" ]; then
          # अगर ज़िप के अंदर सीधे फोल्डर हैं
          SUBDIR=$(find extracted_project -maxdepth 2 -name "build.gradle.kts" -exec dirname {} \;)
          if [ -n "$SUBDIR" ]; then
            cd "$SUBDIR"
            gradle assembleDebug
          else
            echo "build.gradle.kts not found inside extracted folder"
            exit 1
          fi
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KayX-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
