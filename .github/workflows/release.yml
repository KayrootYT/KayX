name: KayX Signed Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require owner-managed signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KAYX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAYX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAYX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAYX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Add KAYX_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Add KAYX_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Add KAYX_KEY_ALIAS repository secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Add KAYX_KEY_PASSWORD repository secret."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kayx-core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Prepare private signing key
        env:
          KEYSTORE_B64: ${{ secrets.KAYX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kayx-release.jks"
          test -s "$RUNNER_TEMP/kayx-release.jks"
      - name: Validate keystore alias and passwords
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kayx-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KAYX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAYX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAYX_KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || {
            echo "::error::Keystore password or key alias is incorrect. Confirm KAYX_KEYSTORE_PASSWORD and KAYX_KEY_ALIAS (expected alias: kayx if generated with the documented command)."
            exit 1
          }
          keytool -certreq -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/kayx-signing-check.csr" >/dev/null || {
            echo "::error::Private key password is incorrect. Set KAYX_KEY_PASSWORD to the password used for the kayx private key."
            exit 1
          }
          rm -f "$RUNNER_TEMP/kayx-signing-check.csr"
      - name: Build signed release APK
        env:
          KAYX_KEYSTORE_PATH: ${{ runner.temp }}/kayx-release.jks
          KAYX_KEYSTORE_PASSWORD: ${{ secrets.KAYX_KEYSTORE_PASSWORD }}
          KAYX_KEY_ALIAS: ${{ secrets.KAYX_KEY_ALIAS }}
          KAYX_KEY_PASSWORD: ${{ secrets.KAYX_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify APK signature and native libraries
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep libkayx_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: KayX-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
