[package]
name = "kayx-core"
version = "0.1.0"
edition = "2021"
description = "KayX native core: hashing, AXML decoding, storage scan, duplicate finder, hex dump"

[lib]
name = "kayx_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
